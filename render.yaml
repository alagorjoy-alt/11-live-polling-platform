# Render blueprint. SQLite needs a persistent disk (paid) or data resets on each deploy.
services:
  - type: web
    name: live-polling
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HASH_SALT
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /tmp/polling.db
